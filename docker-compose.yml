services:
  app:
    build: .
    env_file: .env
    ports:
      # Solo desde el propio VPS: se entra por Nginx. Docker se salta ufw si se publica en 0.0.0.0.
      - "127.0.0.1:9002:9002"
    # Las descargas en curso van en /tmp del contenedor (disco): se borran solas a los 15 minutos y al
    # reiniciar, así que no necesitan volumen.
    restart: unless-stopped
    # Endurecimiento: sin privilegios extra y con tope de memoria y procesos (yt-dlp + ffmpeg incluidos).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9002/entrar').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
