services:
  app:
    build: .
    env_file: .env
    environment:
      YTDLP_POT_URL: http://pot:4416
      YTDLP_COOKIES: /run/secrets/youtube-cookies.txt
    # Cookies de YouTube (opcionales): ./secrets/youtube-cookies.txt en el VPS, fuera de git y de la imagen.
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      - pot
    ports:
      # Solo desde el propio VPS: se entra por Nginx. Docker se salta ufw si se publica en 0.0.0.0.
      - "127.0.0.1:9002:9002"
    # Las descargas en curso van en /tmp del contenedor (disco): se borran solas a los 15 minutos y al
    # reiniciar, así que no necesitan volumen.
    restart: unless-stopped
    # Endurecimiento: sin privilegios extra y con tope de memoria y procesos (yt-dlp + ffmpeg incluidos).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9002/entrar').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      start_interval: 2s

  # Generador de tokens PO para yt-dlp (el plugin bgutil-ytdlp-pot-provider de la imagen le pide tokens).
  # Propio y sin puertos publicados: solo lo ve la app por la red interna de este compose.
  # Misma versión que el plugin del Dockerfile: si no coinciden, yt-dlp no obtiene tokens. Subir las dos juntas.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
